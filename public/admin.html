<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Administration — Luxury Barber</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c9a227;
      --gold-light: #e8c84a;
      --dark: #0d0d0d;
      --dark-2: #161616;
      --dark-3: #1f1f1f;
      --dark-4: #2a2a2a;
      --text: #f0ece4;
      --text-muted: #9e9890;
      --danger: #c0392b;
      --ok: #2e7d32;
      --radius: 12px;
    }

    body {
      background: var(--dark);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.55;
      padding: 24px 16px 80px;
    }

    .wrap { max-width: 820px; margin: 0 auto; }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(201,162,39,0.2);
    }

    h1 { font-size: 1.4rem; color: var(--gold); letter-spacing: 0.02em; }
    header a { color: var(--text-muted); font-size: 0.85rem; text-decoration: none; }
    header a:hover { color: var(--gold); }

    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }

    .tab {
      background: var(--dark-3);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text-muted);
      border-radius: 8px;
      padding: 9px 16px;
      cursor: pointer;
      font: inherit;
      font-size: 0.9rem;
    }

    .tab.active { background: var(--gold); border-color: var(--gold); color: #000; font-weight: 600; }

    .card {
      background: var(--dark-3);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 14px;
    }

    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .row > * { flex: 1; min-width: 110px; }

    label {
      display: block;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    input, select, textarea {
      width: 100%;
      background: var(--dark-4);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 11px 12px;
      color: var(--text);
      font: inherit;
      font-size: 0.95rem;
    }

    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); }
    input[type="file"] { padding: 9px; font-size: 0.85rem; }

    button {
      background: var(--gold);
      border: none;
      color: #000;
      border-radius: 8px;
      padding: 11px 18px;
      font: inherit;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    button:hover:not(:disabled) { background: var(--gold-light); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.ghost { background: none; border: 1px solid rgba(255,255,255,0.18); color: var(--text-muted); }
    button.ghost:hover { border-color: var(--text); color: var(--text); background: none; }
    button.danger { background: var(--danger); color: #fff; }
    button.danger:hover { background: #d84a3a; }

    .msg { border-radius: 8px; padding: 11px 14px; margin-bottom: 16px; font-size: 0.9rem; display: none; }
    .msg.err { display: block; background: rgba(192,57,43,0.15); border: 1px solid var(--danger); color: #f0a0a0; }
    .msg.ok  { display: block; background: rgba(46,125,50,0.15); border: 1px solid var(--ok); color: #a5d6a7; }

    .muted { color: var(--text-muted); font-size: 0.85rem; }
    .hint { color: var(--text-muted); font-size: 0.82rem; margin-bottom: 16px; }
    h2 { font-size: 1.05rem; margin-bottom: 6px; }
    .section-gap { margin-top: 28px; }

    .item-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
    .item-title { font-weight: 600; }
    .pill { font-size: 0.7rem; padding: 3px 9px; border-radius: 99px; background: rgba(201,162,39,0.15); color: var(--gold); }

    .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .media-tile { position: relative; border-radius: 10px; overflow: hidden; background: var(--dark-4); aspect-ratio: 1/1; }
    .media-tile img, .media-tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .media-tile button {
      position: absolute; top: 6px; right: 6px;
      padding: 5px 9px; font-size: 0.72rem; border-radius: 6px;
    }
    .media-cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 8px 6px; font-size: 0.72rem;
      background: linear-gradient(to top, rgba(0,0,0,0.85), transparent); }

    .day-row { display: grid; grid-template-columns: 92px 1fr 1fr auto; gap: 8px; align-items: center; margin-bottom: 8px; }
    .day-row .day-name { font-size: 0.88rem; color: var(--text-muted); }

    .login { max-width: 380px; margin: 60px auto; }

    @media (max-width: 560px) {
      .row > * { min-width: 100%; }
      .day-row { grid-template-columns: 74px 1fr 1fr; }
      .day-row .closed-toggle { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Administration</h1>
    <a href="/">← Retour au site</a>
  </header>

  <div class="msg" id="msg"></div>
  <div id="app"></div>

</div>

<script>
(function () {
  "use strict";

  var WORKER = "https://barbershop.ezalazil.workers.dev";
  var KEY_STORE = "lb_admin_key";
  var DAYS = ["Dimanche", "Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi"];

  var app = document.getElementById("app");
  var msgEl = document.getElementById("msg");

  var st = { key: "", tab: "services", data: null, busy: false };
  try { st.key = localStorage.getItem(KEY_STORE) || ""; } catch (e) {}

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function say(text, kind) {
    msgEl.className = "msg " + (kind || "ok");
    msgEl.textContent = text;
    if (kind !== "err") setTimeout(function () { msgEl.className = "msg"; }, 3500);
  }

  function hhmm(min) {
    return String(Math.floor(min / 60)).padStart(2, "0") + ":" + String(min % 60).padStart(2, "0");
  }
  function toMin(v) {
    var m = /^(\d{1,2}):(\d{2})$/.exec(String(v || "").trim());
    return m ? Number(m[1]) * 60 + Number(m[2]) : null;
  }

  function api(op, extra) {
    return fetch(WORKER + "/api/admin/config", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ key: st.key, op: op }, extra || {})),
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error(j.error || "Erreur " + r.status);
        return j;
      });
    });
  }

  function mediaApi(body) {
    return fetch(WORKER + "/api/admin/media", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ key: st.key }, body)),
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error(j.error || "Erreur " + r.status);
        return j;
      });
    });
  }

  function load() {
    return api("state").then(function (j) {
      st.data = j;
      render();
    });
  }

  // ── Login ────────────────────────────────────────────────────────────
  function renderLogin() {
    app.innerHTML =
      '<div class="card login">' +
      '<h2>Code administrateur</h2>' +
      '<p class="hint">Le même code que dans l\'onglet RDV de l\'application.</p>' +
      '<div class="row"><div><input id="k" type="password" placeholder="Code" autocomplete="current-password"></div>' +
      '<button id="go">Entrer</button></div></div>';

    var input = document.getElementById("k");
    function submit() {
      var v = input.value.trim();
      if (!v) return;
      st.key = v;
      api("state").then(function (j) {
        try { localStorage.setItem(KEY_STORE, v); } catch (e) {}
        st.data = j;
        render();
      }).catch(function (e) {
        st.key = "";
        say(e.message, "err");
      });
    }
    document.getElementById("go").addEventListener("click", submit);
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
    input.focus();
  }

  // ── Services ─────────────────────────────────────────────────────────
  function renderServices() {
    var live = st.data.services.filter(function (s) { return s.active; });
    var html = '<p class="hint">Le prix affiché sur le site est le tarif RDV en ligne. ' +
      'Le tarif Planity apparaît barré à côté, avec l\'économie.</p>';

    live.forEach(function (s) {
      html +=
        '<div class="card" data-svc="' + esc(s.id) + '">' +
        '<div class="item-head"><span class="item-title">' + esc(s.label) + '</span>' +
        '<span class="pill">' + esc(s.id) + '</span></div>' +
        '<div class="row">' +
        '<div><label>Nom</label><input class="f-label" value="' + esc(s.label) + '"></div>' +
        '<div><label>Prix ici (€)</label><input class="f-price" type="number" step="0.01" min="0" value="' + s.price + '"></div>' +
        '<div><label>Prix Planity (€)</label><input class="f-planity" type="number" step="0.01" min="0" value="' + (s.planity == null ? "" : s.planity) + '" placeholder="—"></div>' +
        '<div><label>Ordre</label><input class="f-sort" type="number" value="' + s.sort + '"></div>' +
        '</div><div style="margin-top:10px"><label>Description (affichée sur le site)</label>' +
        '<textarea class="f-desc" rows="2" maxlength="300">' + esc(s.description || "") + "</textarea></div>" +
        '<div class="row" style="margin-top:10px">' +
        '<button class="save">Enregistrer</button>' +
        '<button class="ghost del" style="flex:0 0 auto">Retirer du site</button>' +
        '</div></div>';
    });

    html +=
      '<div class="card section-gap"><h2>Ajouter une prestation</h2>' +
      '<p class="hint">L\'identifiant sert en interne (lettres, chiffres, tirets). Il ne change plus ensuite.</p>' +
      '<div class="row">' +
      '<div><label>Identifiant</label><input id="n-id" placeholder="rasage"></div>' +
      '<div><label>Nom</label><input id="n-label" placeholder="Rasage traditionnel"></div>' +
      '</div><div class="row" style="margin-top:10px">' +
      '<div><label>Prix ici (€)</label><input id="n-price" type="number" step="0.01" min="0" placeholder="16"></div>' +
      '<div><label>Prix Planity (€)</label><input id="n-planity" type="number" step="0.01" min="0" placeholder="facultatif"></div>' +
      '<div><label>Illustration</label><select id="n-icon">' +
      '<option value="ico-ciseaux">Ciseaux</option><option value="ico-rasoir">Tondeuse</option>' +
      '<option value="ico-poteau">Enseigne</option><option value="ico-enfant">Enfant</option>' +
      '<option value="ico-peigne">Peigne</option></select></div>' +
      '</div><div style="margin-top:10px"><label>Description</label>' +
      '<textarea id="n-desc" rows="2" maxlength="300" placeholder="Rasage à l\'ancienne, serviette chaude."></textarea></div>' +
      '<div class="row" style="margin-top:10px"><button id="n-add">Ajouter</button></div></div>';

    app.innerHTML = html;

    app.querySelectorAll("[data-svc]").forEach(function (card) {
      var id = card.dataset.svc;
      card.querySelector(".save").addEventListener("click", function () {
        api("service-save", {
          service: {
            id: id,
            label: card.querySelector(".f-label").value,
            price: card.querySelector(".f-price").value,
            planity: card.querySelector(".f-planity").value,
            description: card.querySelector(".f-desc").value,
            sort: card.querySelector(".f-sort").value,
            icon: (st.data.services.filter(function (s) { return s.id === id; })[0] || {}).icon,
          },
        }).then(function () { say("Prestation enregistrée"); return load(); })
          .catch(function (e) { say(e.message, "err"); });
      });
      card.querySelector(".del").addEventListener("click", function () {
        if (!confirm("Retirer cette prestation du site ? Les rendez-vous passés sont conservés.")) return;
        api("service-delete", { id: id })
          .then(function () { say("Prestation retirée"); return load(); })
          .catch(function (e) { say(e.message, "err"); });
      });
    });

    document.getElementById("n-add").addEventListener("click", function () {
      api("service-save", {
        service: {
          id: document.getElementById("n-id").value,
          label: document.getElementById("n-label").value,
          price: document.getElementById("n-price").value,
          planity: document.getElementById("n-planity").value,
          description: document.getElementById("n-desc").value,
          icon: document.getElementById("n-icon").value,
          sort: 50,
        },
      }).then(function () { say("Prestation ajoutée"); return load(); })
        .catch(function (e) { say(e.message, "err"); });
    });
  }

  // ── Barbiers ─────────────────────────────────────────────────────────
  function renderBarbers() {
    var live = st.data.barbers.filter(function (b) { return b.active; });
    var html = '<p class="hint">Retirer un barbier le masque du site — ses rendez-vous et ses recettes restent intacts.</p>';

    live.forEach(function (b) {
      html +=
        '<div class="card" data-barber="' + esc(b.id) + '">' +
        '<div class="item-head"><span class="item-title">' + esc(b.name) + '</span></div>' +
        '<div class="row">' +
        (b.photo
          ? '<div style="flex:0 0 auto"><img src="' + esc(WORKER + b.photo) + '" alt="" style="width:64px;height:64px;border-radius:50%;object-fit:cover"></div>'
          : "") +
        '<div><label>Nom</label><input class="f-name" value="' + esc(b.name) + '"></div>' +
        '<div><label>Ordre</label><input class="f-sort" type="number" value="' + b.sort + '"></div>' +
        '<button class="save">Enregistrer</button>' +
        '</div>' +
        '<div class="row" style="margin-top:10px">' +
        '<div><label>Photo de profil</label><input class="f-photo" type="file" accept="image/*"></div>' +
        (b.photo ? '<button class="ghost delphoto">Retirer la photo</button>' : "") +
        '<button class="danger del" style="flex:0 0 auto">Retirer</button>' +
        '</div></div>';
    });

    html +=
      '<div class="card section-gap"><h2>Ajouter un barbier</h2>' +
      '<div class="row"><div><label>Nom</label><input id="b-name" placeholder="Yacine"></div>' +
      '<button id="b-add">Ajouter</button></div></div>';

    app.innerHTML = html;

    app.querySelectorAll("[data-barber]").forEach(function (card) {
      var id = card.dataset.barber;
      card.querySelector(".save").addEventListener("click", function () {
        api("barber-save", {
          barber: { id: id, name: card.querySelector(".f-name").value, sort: card.querySelector(".f-sort").value },
        }).then(function () { say("Barbier enregistré"); return load(); })
          .catch(function (e) { say(e.message, "err"); });
      });
      card.querySelector(".del").addEventListener("click", function () {
        if (!confirm("Retirer ce barbier du site ? Son historique est conservé.")) return;
        api("barber-delete", { id: id })
          .then(function () { say("Barbier retiré"); return load(); })
          .catch(function (e) { say(e.message, "err"); });
      });
      var dp = card.querySelector(".delphoto");
      if (dp) dp.addEventListener("click", function () {
        mediaApi({ op: "barber-photo-delete", id: id })
          .then(function () { say("Photo retirée"); return load(); })
          .catch(function (e) { say(e.message, "err"); });
      });
      card.querySelector(".f-photo").addEventListener("change", function (e) {
        var file = e.target.files[0];
        if (!file) return;
        upload(file, { target: "barber", barberId: id });
      });
    });

    document.getElementById("b-add").addEventListener("click", function () {
      api("barber-save", { barber: { name: document.getElementById("b-name").value, sort: 50 } })
        .then(function () { say("Barbier ajouté"); return load(); })
        .catch(function (e) { say(e.message, "err"); });
    });
  }

  // ── Horaires ─────────────────────────────────────────────────────────
  function renderHours() {
    var h = st.data.hours || {};
    var html = '<div class="card"><h2>Horaires d\'ouverture</h2>' +
      '<p class="hint">Décochez un jour pour le fermer complètement.</p>';

    for (var d = 1; d <= 7; d++) {
      var day = d % 7; // afficher lundi → dimanche
      var v = h[day] || h[String(day)];
      var open = v ? hhmm(v[0]) : "09:30";
      var close = v ? hhmm(v[1]) : "20:00";
      html +=
        '<div class="day-row" data-day="' + day + '">' +
        '<span class="day-name">' + DAYS[day] + "</span>" +
        '<input class="f-open" type="time" value="' + open + '"' + (v ? "" : " disabled") + ">" +
        '<input class="f-close" type="time" value="' + close + '"' + (v ? "" : " disabled") + ">" +
        '<label class="closed-toggle muted" style="text-transform:none;letter-spacing:0;margin:0">' +
        '<input class="f-open-day" type="checkbox"' + (v ? " checked" : "") + ' style="width:auto;margin-right:6px">Ouvert</label>' +
        "</div>";
    }

    html +=
      '<div class="row section-gap"><div><label>Durée d\'un créneau</label><select id="slot">' +
      [10, 15, 20, 30, 45, 60].map(function (n) {
        return '<option value="' + n + '"' + (st.data.slotMinutes === n ? " selected" : "") + ">" + n + " minutes</option>";
      }).join("") +
      "</select></div><button id=\"h-save\">Enregistrer</button></div></div>";

    app.innerHTML = html;

    app.querySelectorAll(".day-row").forEach(function (row) {
      row.querySelector(".f-open-day").addEventListener("change", function (e) {
        row.querySelector(".f-open").disabled = !e.target.checked;
        row.querySelector(".f-close").disabled = !e.target.checked;
      });
    });

    document.getElementById("h-save").addEventListener("click", function () {
      var hours = {};
      var bad = null;
      app.querySelectorAll(".day-row").forEach(function (row) {
        var day = row.dataset.day;
        if (!row.querySelector(".f-open-day").checked) { hours[day] = null; return; }
        var o = toMin(row.querySelector(".f-open").value);
        var c = toMin(row.querySelector(".f-close").value);
        if (o == null || c == null || o >= c) bad = DAYS[Number(day)];
        hours[day] = [o, c];
      });
      if (bad) return say("Horaires invalides pour " + bad + " — l'ouverture doit précéder la fermeture.", "err");

      api("hours-save", { hours: hours, slotMinutes: Number(document.getElementById("slot").value) })
        .then(function () { say("Horaires enregistrés"); return load(); })
        .catch(function (e) { say(e.message, "err"); });
    });
  }

  // ── Galerie ──────────────────────────────────────────────────────────
  function upload(file, extra) {
    var form = new FormData();
    form.set("key", st.key);
    form.set("file", file);
    Object.keys(extra || {}).forEach(function (k) { form.set(k, extra[k]); });
    say("Envoi en cours…");
    return fetch(WORKER + "/api/admin/media", { method: "POST", body: form })
      .then(function (r) {
        return r.json().then(function (j) {
          if (!r.ok) throw new Error(j.error || "Erreur " + r.status);
          return j;
        });
      })
      .then(function () { say("Ajouté"); return load(); })
      .catch(function (e) { say(e.message, "err"); });
  }

  function renderGallery() {
    if (!st.data.storage) {
      app.innerHTML =
        '<div class="card"><h2>Stockage non configuré</h2>' +
        '<p class="hint">Pour envoyer des photos et vidéos, créez un bucket R2 dans Cloudflare et liez-le au Worker ' +
        '<strong>barbershop</strong> sous le nom <strong>MEDIA</strong>. Tout le reste fonctionne sans.</p></div>';
      return;
    }

    var html =
      '<div class="card"><h2>Ajouter une photo ou une vidéo</h2>' +
      '<p class="hint">JPEG, PNG, WebP, MP4, MOV ou WebM — 25 Mo maximum par fichier.</p>' +
      '<div class="row"><div><label>Fichier</label><input id="g-file" type="file" accept="image/*,video/*"></div>' +
      '<div><label>Légende (facultatif)</label><input id="g-cap" placeholder="Dégradé + barbe"></div></div></div>';

    if (st.data.media.length) {
      html += '<div class="card"><h2>Galerie (' + st.data.media.length + ')</h2><div class="media-grid">';
      st.data.media.forEach(function (m) {
        var url = WORKER + m.url;
        html += '<div class="media-tile" data-media="' + esc(m.id) + '">' +
          (m.kind === "video"
            ? '<video src="' + esc(url) + '" muted preload="metadata"></video>'
            : '<img src="' + esc(url) + '" alt="" loading="lazy">') +
          '<button class="danger del">✕</button>' +
          (m.caption ? '<div class="media-cap">' + esc(m.caption) + "</div>" : "") +
          "</div>";
      });
      html += "</div></div>";
    } else {
      html += '<p class="hint">Aucun média pour l\'instant. La section « Nos réalisations » reste masquée sur le site tant qu\'elle est vide.</p>';
    }

    app.innerHTML = html;

    document.getElementById("g-file").addEventListener("change", function (e) {
      var file = e.target.files[0];
      if (!file) return;
      upload(file, { target: "gallery", caption: document.getElementById("g-cap").value });
    });

    app.querySelectorAll("[data-media] .del").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.closest("[data-media]").dataset.media;
        if (!confirm("Supprimer définitivement ce média ?")) return;
        mediaApi({ op: "delete", id: id })
          .then(function () { say("Supprimé"); return load(); })
          .catch(function (e) { say(e.message, "err"); });
      });
    });
  }

  // ── Shell ────────────────────────────────────────────────────────────
  function render() {
    if (!st.key || !st.data) return renderLogin();

    var tabs = [
      ["services", "Prestations"],
      ["barbers", "Barbiers"],
      ["hours", "Horaires"],
      ["gallery", "Galerie"],
    ];

    var bar = document.createElement("div");
    bar.className = "tabs";
    bar.innerHTML = tabs.map(function (t) {
      return '<button class="tab ' + (st.tab === t[0] ? "active" : "") + '" data-tab="' + t[0] + '">' + t[1] + "</button>";
    }).join("");

    app.innerHTML = "";
    app.appendChild(bar);
    var body = document.createElement("div");
    app.appendChild(body);

    var host = app;
    app = body; // the section renderers write into the body
    if (st.tab === "services") renderServices();
    else if (st.tab === "barbers") renderBarbers();
    else if (st.tab === "hours") renderHours();
    else renderGallery();
    app = host;

    bar.querySelectorAll("[data-tab]").forEach(function (b) {
      b.addEventListener("click", function () { st.tab = b.dataset.tab; render(); });
    });
  }

  if (st.key) {
    load().catch(function () { st.key = ""; renderLogin(); });
  } else {
    renderLogin();
  }
})();
</script>
</body>
</html>
